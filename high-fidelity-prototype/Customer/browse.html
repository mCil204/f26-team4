<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Cleaners</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>

<body class="d-flex flex-column min-vh-100">
 
     <header>
        <nav class="navbar navbar-expand site-nav" data-bs-theme="dark">
            <div class="container">
                <a class="navbar-brand fw-bold" href="../index.html">CleanSweep</a>
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="profileCustomer.html">Profile</a></li>
                    <li class="nav-item"><a class="nav-link" href="../about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
                    <li class="nav-item"><a class="nav-link active" href="browse.html">Browse</a></li>
                </ul>
                    <a class="btn btn-outline-primary" href="../index.html">Log Out</a>
            </div>
        </nav>
    </header>
 
  <main class="flex-grow-1">
    <section class="py-5 bg-body-tertiary">
      <div class="container text-center py-5">
        <hr class="accent-rule">
        <h1 class="display-5 fw-bold">Find the Right Cleaner for You</h1>
        <p class="lead text-body-secondary mx-auto mb-5" style="max-width: 40rem;">
          Browse trusted local cleaners, compare rates and reviews, and book the one that fits your needs.
        </p>
        <div class="card text-start mx-auto" style="max-width: 800px;">
          <div class="p-4">
            <form id="search-form">
              <div class="row g-3 align-items-end">
                <div class="col-md-5">
                  <label for="location" class="form-label">Location</label>
                  <input type="text" class="form-control" id="location" name="location" placeholder="Enter your zip code">
                </div>
                <div class="col-md-4">
                  <label for="service-type" class="form-label">Service type</label>
                  <select class="form-select" id="service-type" name="service-type">
                    <option value="any">Any</option>
                    <option value="standard">Standard Cleaning</option>
                    <option value="deep">Deep Cleaning</option>
                    <option value="move">Move In/Out</option>
                    <option value="office">Office Cleaning</option>
                  </select>
                </div>
                <div class="col-md-3">
                  <a class="btn btn-primary w-100" href="services.html">Search Cleaners</a>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>
 
  <footer class="site-footer py-5">
      <p class="mb-0 small text-center">
        &copy; 2026 CleanSweep. All rights reserved. For Educational Purposes Only.
      </p>
  </footer>
 
</body>
</html>
