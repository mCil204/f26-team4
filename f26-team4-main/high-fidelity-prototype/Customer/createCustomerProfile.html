<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Profile Creation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../style.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>

<body class="d-flex flex-column min-vh-100">

  <header>
    <nav class="navbar navbar-expand site-nav" data-bs-theme="dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="../index.html">CleanSweep</a>
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link active" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="../about.html">About</a></li>
        </ul>
        
          <a class="btn btn-outline-primary" href="createCustomerProfile.html">Create Profile</a>
        
      </div>
    </nav>
  </header>

  <main class="flex-grow-1">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-10 col-lg-6">
          <div class="card p-4 p-md-5">
            <h1 class="h3 fw-bold mb-4">Create Your Profile</h1>

            <form action="browse.html" method="get">

              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label for="first-name" class="form-label">First name</label>
                  <input type="text" class="form-control" id="first-name" name="first-name" required>
                </div>
                <div class="col-md-6">
                  <label for="last-name" class="form-label">Last name</label>
                  <input type="text" class="form-control" id="last-name" name="last-name" required>
                </div>
              </div>

              <div class="mb-3">
                <label for="profile-email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="profile-email" name="profile-email" required>
              </div>

              <div class="mb-3">
                <label for="phone" class="form-label">Phone number</label>
                <input type="tel" class="form-control" id="phone" name="phone">
              </div>

              <div class="mb-3">
                <label for="address" class="form-label">Home address</label>
                <textarea class="form-control" id="address" name="address" rows="3"></textarea>
              </div>

              <div class="mb-3">
                <label for="notes" class="form-label">Notes</label>
                <textarea class="form-control" id="notes" name="notes" rows="3"
                  placeholder="Let us know a little bit about yourself"></textarea>
              </div>

              <!-- passwords have no name attribute so they never end up in the URL -->
              <div class="mb-3">
                <label for="new-password" class="form-label">Create password</label>
                <input type="password" class="form-control" id="new-password" required>
              </div>

              <div class="mb-3">
                <label for="confirm-password" class="form-label">Confirm password</label>
                <input type="password" class="form-control" id="confirm-password" required>
              </div>

              <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="terms" name="terms" required>
                <label class="form-check-label" for="terms">I agree to the terms and conditions.</label>
              </div>

              <button type="submit" class="btn btn-primary btn-lg w-100">Create Profile</button>
            </form>

            <p class="mt-4 mb-0 text-center text-body-secondary">
              Already have an account? <a href="../login.html">Log in here.</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer py-5">
    <div class="container">
      <p class="mb-0 small text-center">
        &copy; 2026 CleanSweep. All rights reserved. For Educational Purposes Only.
      </p>
    </div>
  </footer>

</body>

</html>
