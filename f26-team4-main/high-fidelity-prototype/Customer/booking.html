<head>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../style.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>

<body class="d-flex flex-column min-vh-100">

  <header>
    <nav class="navbar navbar-expand site-nav" data-bs-theme="dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="../index.html">CleanSweep</a>
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="profileCustomer.html">Profile</a></li>
          <li class="nav-item"><a class="nav-link" href="../about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
          <li class="nav-item"><a class="nav-link" href="browse.html">Browse</a></li>
        </ul>
        <a class="btn btn-outline-primary" href="../index.html">Log Out</a>
      </div>
    </nav>
  </header>

  <main class="flex-grow-1">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
          <div class="card p-4 p-md-5">
            <h1 class="h3 fw-bold mb-4">Book Your Cleaning</h1>

            <div class="mb-4">
              <label for="date-needed" class="form-label">Booking date</label>
              <input type="date" class="form-control" id="date-needed" name="date-needed">
            </div>
            <div class="col-md-4">
                  <label for="time-slot" class="form-label">Time slot</label>
                  <select class="form-select" id="time-slot" name="time-slot">
                    <option value="morning">Morning (9AM - 12PM)</option>
                    <option value="afternoon">Afternoon (12PM - 5PM)</option>
                    <option value="evening">Evening (5PM - 9PM)</option>
                  </select>
                </div>
            <a class="btn btn-primary btn-lg w-100" href="confirm.html">Confirm Booking</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer py-5">
